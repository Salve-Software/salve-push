name: cli
on:
  push:
    paths: ["packages/cli/**", "packages/protocol/**", "protocol/**"]
  pull_request:
    paths: ["packages/cli/**", "packages/protocol/**", "protocol/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @salve-push/protocol... --filter salve-push build
      - run: pnpm --filter salve-push lint
