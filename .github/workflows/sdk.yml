name: sdk
on:
  push:
    paths: ["packages/sdk-react-native/**", "packages/protocol/**", "protocol/**", "examples/react-native-demo/**"]
  pull_request:
    paths: ["packages/sdk-react-native/**", "packages/protocol/**", "protocol/**", "examples/react-native-demo/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm protocol:generate
      - run: pnpm --filter @salve-push/protocol... --filter react-native-salve-push build
      - run: pnpm --filter react-native-salve-push lint
      - run: pnpm --filter react-native-salve-push test

  android:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - run: pnpm protocol:generate
      - run: pnpm --filter @salve-push/protocol... --filter react-native-salve-push build
      - name: Build example app (Android debug)
        working-directory: examples/react-native-demo/android
        run: ./gradlew :app:assembleDebug --console=plain

  ios:
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm protocol:generate
      - run: pnpm --filter @salve-push/protocol... --filter react-native-salve-push build
      - name: pod install
        working-directory: examples/react-native-demo/ios
        run: pod install
      - name: Build example app (iOS simulator, Debug)
        working-directory: examples/react-native-demo/ios
        run: |
          xcodebuild -workspace ReactNativeDemo.xcworkspace -scheme ReactNativeDemo \
            -configuration Debug -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build
